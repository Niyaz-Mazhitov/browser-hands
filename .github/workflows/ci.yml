name: ci

on:
  push:
  pull_request:

jobs:
  check:
    # без Chrome и без ключей: только офлайн-проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
      - run: bash scripts/check.sh
